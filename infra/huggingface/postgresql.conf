# PostgreSQL Configuration (HuggingFace Spaces — 轻量化)
# 适配 2vCPU / 16GB RAM 环境，降低内存占用

listen_addresses = '127.0.0.1'
port = 5432

# 连接
max_connections = 50

# 内存（保守设置，与其他服务共享 16GB）
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL（临时环境，性能优先）
wal_level = minimal
max_wal_senders = 0
fsync = off
synchronous_commit = off
full_page_writes = off

# 日志
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning

# 自动清理
autovacuum = on
