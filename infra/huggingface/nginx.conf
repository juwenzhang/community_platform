# Luhanxin Community Platform — Nginx (HuggingFace Spaces)
# 单端口 7860 对外，反向代理到 Gateway (:8000)

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr upstream_status=$upstream_status upstream_rt=$upstream_response_time '
                    'origin="$http_origin" referer="$http_referer" ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/grpc-web application/grpc-web+proto
               application/connect+proto;

    upstream gateway {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 7860;
        server_name _;

        # ── 健康检查（Nginx 直接响应，不经过 Gateway）──
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"luhanxin-community-backend"}';
            add_header Content-Type application/json;
        }

        # ── Connect RPC / gRPC-Web → Gateway ──
        location /luhanxin.community.v1 {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── REST API → Gateway ──
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            client_max_body_size 50m;

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ── Swagger UI → Gateway ──
        location /swagger-ui {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── OpenAPI JSON → Gateway ──
        location /api-docs/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── 默认：返回 Gateway 信息 ──
        location / {
            return 200 '{"service":"luhanxin-community-backend","docs":"/swagger-ui/","health":"/health"}';
            add_header Content-Type application/json;
        }
    }
}
