[supervisord]
nodaemon=true
user=user
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx-log]
command=python3 /app/config/colorize-nginx-log.py
autostart=true
autorestart=true
priority=55
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /app/data/postgres -c config_file=/app/config/postgresql.conf
autostart=true
autorestart=true
priority=100
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --port 6379 --requirepass %(ENV_REDIS_PASSWORD)s --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=100
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nats]
command=nats-server -p 4222 -m 8222
autostart=true
autorestart=true
priority=100
startsecs=2
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:consul]
command=/usr/local/bin/consul agent -dev -client=0.0.0.0 -data-dir=/app/data/consul -bind=127.0.0.1
autostart=true
autorestart=true
priority=100
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:meilisearch]
command=/usr/local/bin/meilisearch --http-addr 127.0.0.1:7700 --env production --master-key %(ENV_MEILI_MASTER_KEY)s --db-path /app/data/meilisearch
autostart=true
autorestart=true
priority=100
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:migration]
command=bash /app/config/run-migration.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=150
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:svc-user]
command=bash /app/config/wait-and-run.sh svc-user /app/bin/svc-user
directory=/app
autostart=true
autorestart=true
priority=300
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:svc-content]
command=bash /app/config/wait-and-run.sh svc-content /app/bin/svc-content
directory=/app
autostart=true
autorestart=true
priority=300
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:svc-notification]
command=bash /app/config/wait-and-run.sh svc-notification /app/bin/svc-notification
directory=/app
autostart=true
autorestart=true
priority=300
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:gateway]
command=bash /app/config/wait-and-run.sh gateway /app/bin/gateway
directory=/app
autostart=true
autorestart=true
priority=350
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
