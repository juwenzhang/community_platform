name: Deploy Backend to HuggingFace Space

on:
  push:
    branches: [master]
    paths:
      # 后端代码变更
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'crates/**'
      - 'services/**'
      # 后端工程化与部署脚本
      - 'Dockerfile'
      - 'Makefile'
      - 'scripts/**'
      - 'infra/huggingface/**'
      - '.github/workflows/deploy-hf-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/deploy-hf.sh
